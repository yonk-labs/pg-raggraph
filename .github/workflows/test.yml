name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly dependency audit — catches new CVEs landing in uv.lock
    # between pushes (PR-216 / GAP-021).
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Dependency audit
        # --no-emit-project: the editable project has no hashable artifact,
        # and pip-audit requires hashes for everything in the file.
        run: |
          uv export --format requirements-txt --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps


  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pg_raggraph
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --frozen
      - name: Install spaCy model
        run: uv run python -m spacy download en_core_web_sm
      - name: Enable extensions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5434 -U postgres -d pg_raggraph \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Unit tests
        run: uv run pytest tests/unit/ -v
      - name: Integration + E2E tests
        env:
          PGRG_DSN: postgresql://postgres:postgres@localhost:5434/pg_raggraph
        run: uv run pytest tests/integration/ -v
